<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Kelebek Sınav Dağıtım Sistemi | Giriş</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

    <!-- Background Animation Elements -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="login-container">
        <div class="login-card glass-panel">
            <div class="login-header">
                <div class="logo-icon">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <h2>Ana Giriş</h2>
                <h3 id="loginSchoolName" style="color: var(--primary); font-weight: 700; margin: 0.3rem 0 0 0; font-size: 1.1rem; display: none;"></h3>
                <p>Yönetim paneline giriş yapın</p>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Kullanıcı Adı veya E-Posta</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Kullanıcı adı veya e-posta girin" required
                            autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Şifre</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Şifrenizi girin" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"></span>
                        Beni Hatırla
                    </label>
                    <a href="#" class="forgot-link">Şifremi Unuttum</a>
                </div>

                <div id="loginMessage" class="message-box hidden"></div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <span>Giriş Yap</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
            <div class="login-footer">
                <p style="margin-top: 10px; color: var(--gray-400);">Sürüm 1.2 &copy; 2026</p>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="js/auth.js?v=2.10"></script>


<style>
.loader-wrapper { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.loader-wrapper.fade-out { opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0.5s ease; }
.loader-content { text-align: center; }
.loader-dual-ring { display: inline-block; width: 64px; height: 64px; margin: 0 auto 1.5rem; }
.loader-dual-ring:after { content: " "; display: block; width: 46px; height: 46px; margin: 8px; border-radius: 50%; border: 6px solid #d946ef; border-color: #d946ef transparent #d946ef transparent; animation: dual-ring-anim 1.2s linear infinite; }
@keyframes dual-ring-anim { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.loader-content p { font-size: 1.1rem; font-weight: 600; color: #d946ef; letter-spacing: 1px; text-transform: uppercase; font-family: sans-serif; margin: 0; }
</style>
<div id="appLoader" class="loader-wrapper"><div class="loader-content"><div class="loader-dual-ring"></div><p>Sistem Hazırlanıyor...</p></div></div>
<script>
window.addEventListener('DOMContentLoaded', () => {
    const loader = document.getElementById('appLoader');
    if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 600);
    }
});
</script>

</body>

</html>
