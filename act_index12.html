<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Etkinlik Yönetim Paneli</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* GENEL STİLLER */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-size: 14px;
        }

        h1 {
            text-align: center;
            padding: 15px;
            background: #673AB7;
            color: white;
            margin: 0;
            font-size: 1.2rem;
        }

        .tab-container {
            display: flex;
            flex-direction: column;
        }

        .tab-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            background: #ede7f6;
            border-bottom: 1px solid #d1c4e9;
        }

        .tab-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: bold;
            color: #5e35b1;
            transition: 0.3s;
        }

        .tab-buttons button.active {
            background: #673AB7;
            color: white;
        }

        .tab-content {
            display: none;
            padding: 15px;
        }

        .tab-content.active {
            display: block;
        }

        /* BUTONLAR */
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
            justify-content: center;
        }

        button.action {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button.blue {
            background-color: #2196F3;
        }

        button.red {
            background-color: #f44336;
        }

        button.orange {
            background-color: #FF9800;
        }

        select,
        input[type="number"],
        input[type="text"] {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #d1c4e9;
            outline: none;
            background: white;
        }

        .grup-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 25px;
            justify-content: center;
        }

        .grup {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
            background: white;
            width: 300px;
        }

        .grup h3 {
            margin-top: 0;
            color: #673AB7;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #eee;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f5f5f5;
            color: #333;
        }

        #calismaListesi {
            list-style-type: none;
            padding: 0;
            margin-top: 15px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #calismaListesi li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border: 1px solid #e0e0e0;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            background: #fff;
        }

        #calismaListesi li.selected {
            background-color: #ede7f6;
            border: 2px solid #673AB7;
            color: #5e35b1;
            font-weight: bold;
        }

        .btn-archive-small {
            background: #FF9800;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .atama-panel {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #d1c4e9;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            justify-content: center;
        }

        .timer-text {
            font-family: monospace;
            font-weight: bold;
            color: #d32f2f;
            font-size: 1.1em;
        }

        .yonetim-cerceve {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #d1c4e9;
            margin-bottom: 15px;
        }

        .yonetim-toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .chk-container {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #333;
            margin: 0;
        }

        .kucuk-select {
            padding: 6px;
            font-size: 12px;
            min-width: 140px;
        }

        #degerlendirmeContainer {
            display: none;
            margin-top: 15px;
            border-top: 2px solid #673AB7;
            padding-top: 15px;
        }

        .deg-card {
            background: white;
            width: 100%;
            border-radius: 8px;
            display: flex;
            flex-direction: row;
            height: 450px;
            border: 1px solid #bbb;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .deg-soru-bolumu {
            background: #e8f5e9;
            padding: 20px;
            border-right: 1px solid #c8e6c9;
            color: #1b5e20;
            overflow-y: auto;
            flex: 0 0 40%;
            display: flex;
            flex-direction: column;
            font-size: 0.95rem;
        }

        .deg-cevap-bolumu {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            background: #fff;
            font-size: 0.95rem;
        }

        .deg-cevap-item {
            position: relative;
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
            padding: 12px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 6px;
            min-height: 60px;
            cursor: pointer;
        }

        .deg-cevap-metin {
            flex: 1;
            min-height: 40px;
            padding-right: 70px;
            word-wrap: break-word;
        }

        .deg-buton-grubu {
            position: absolute;
            bottom: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            z-index: 5;
        }

        .deg-btn-puan {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            color: #666;
        }

        .deg-dogru.aktif {
            background: #2e7d32 !important;
            color: white !important;
        }

        .deg-yanlis.aktif {
            background: #d32f2f !important;
            color: white !important;
        }

        .deg-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #eee;
            padding: 12px 20px;
            border-radius: 6px;
            margin-bottom: 8px;
            position: relative;
            min-height: 40px;
        }

        .deg-header-left {
            text-align: left;
            font-weight: bold;
            color: #d32f2f;
            font-size: 1.1rem;
            text-transform: uppercase;
            z-index: 2;
            flex: 1;
        }

        .deg-header-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-weight: bold;
            color: #000;
            font-size: 1.1rem;
            z-index: 1;
            white-space: nowrap;
        }

        .deg-header-right {
            text-align: right;
            font-weight: bold;
            color: #673AB7;
            font-size: 1.1rem;
            z-index: 2;
            flex: 1;
        }

        .deg-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 20px;
            width: 80%;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .soru-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            background: #fdfdfd;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #eee;
        }

        .soru-no {
            font-weight: bold;
            color: #673AB7;
            min-width: 70px;
        }

        /* MEDYA GÖMME STİLLERİ */
        .embedded-wrapper {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 5px;
            background: #fff;
        }

        .embedded-img {
            max-height: 200px;
            max-width: 100%;
            cursor: pointer;
            transition: transform 0.2s;
            display: block;
            margin: 0 auto;
        }

        .embedded-img:hover {
            transform: scale(1.02);
        }

        .embedded-img.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            object-fit: contain;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            box-sizing: border-box;
        }

        .embedded-video {
            max-width: 100%;
            height: auto;
            max-height: 300px;
            display: block;
            margin: 0 auto;
        }

        .embedded-audio {
            width: 100%;
        }

        .embedded-iframe {
            width: 100%;
            height: 400px;
            border: none;
        }

        .embed-fallback {
            text-align: center;
            font-size: 12px;
            margin-top: 5px;
            background: #f1f1f1;
            padding: 5px;
            border-radius: 4px;
        }

        .embed-fallback a {
            color: #1976D2;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Etkinlik Yönetim Paneli</h1>
    <div class="tab-container">
        <div class="tab-buttons">
            <button onclick="openTab(event,'sekme1')">Çalışma Şekli</button>
            <button onclick="openTab(event,'sekme2')">Çalışma İçeriği</button>
            <button class="active" onclick="openTab(event,'sekme3')">Çalışma Süreci</button>
            <button onclick="openTab(event,'sekme4')">Değerlendirme</button>
        </div>

        <div id="sekme1" class="tab-content">
            <div style="text-align: center;">
                <select id="sinifSec" style="width: 250px;">
                    <option value="">-- Sınıf Seçin --</option>
                </select>
                <div class="button-group">
                    <button id="btnGrupla" class="action">Sınıfı Gruplara Böl</button>
                    <button id="btnSil" class="action red">Mevcut Grupları Sil</button>
                </div>
            </div>
            <div id="tablo" class="grup-container"></div>
        </div>

        <div id="sekme2" class="tab-content">
            <div id="listeEkrani">
                <div class="button-group">
                    <button onclick="arsivModalAc()" class="action orange">📂 Arşivden Çalışma Ekle</button>
                    <button id="btnYeni" class="action">Yeni Çalışma Ekle</button>
                    <button id="btnDuzenle" class="action blue">Seçileni Düzenle</button>
                    <button id="btnSilDosya" class="action red">Seçileni Sil</button>
                </div>
                <ul id="calismaListesi"></ul>
            </div>
            <div id="editorEkrani"
                style="display:none; border: 1px solid #d1c4e9; padding: 20px; border-radius: 10px; background: white; max-width: 800px; margin: 0 auto;">
                <h3 id="editorBaslik" style="color: #673AB7; text-align: center; margin-top:0;"></h3>
                <textarea id="calismaAciklama"
                    style="width: 95%; height: 80px; padding: 12px; border: 1px solid #d1c4e9; border-radius: 8px; display: block; margin: 10px auto;"
                    placeholder="Yönergeleri buraya yazın..."></textarea>
                <div id="soruAlani"></div>
                <div class="button-group">
                    <button id="btnSoruEkle" class="action blue">+ Yeni Soru</button>
                    <button id="btnKaydet" class="action">💾 Kaydet</button>
                    <button onclick="location.reload()" class="action red">İptal</button>
                </div>
            </div>
        </div>

        <div id="sekme3" class="tab-content active">
            <div class="atama-panel">
                <div>Sınıf:<br><select id="s3SinifSec" style="width:140px;">
                        <option value="">-- Seçin --</option>
                    </select></div>
                <div>Çalışma:<br><select id="s3CalismaSec" style="width:140px;">
                        <option value="">-- Seçin --</option>
                    </select></div>
                <div>Yöntem:<br><select id="s3YontemSec" style="width:110px;">
                        <option value="">-- Seçin --</option>
                        <option value="Grup">Grup</option>
                        <option value="Tek">Tek</option>
                    </select></div>
                <button id="btnS3Olustur" class="action blue" style="min-width:100px;">Oluştur</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Sınıf</th>
                        <th>Çalışma Adı</th>
                        <th>Yöntem</th>
                        <th>Görme</th>
                        <th>Yapma</th>
                        <th>Değerl.</th>
                        <th>Süre</th>
                        <th>Kalan</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="atamaBody"></tbody>
            </table>
        </div>

        <div id="sekme4" class="tab-content">
            <div class="yonetim-cerceve" id="degSecimPaneli">
                <div class="yonetim-toolbar">
                    <label class="chk-container"><input type="checkbox" id="chkDegerlendirmeIzin" disabled> Öğrenci
                        İzni</label>
                    <label class="chk-container"><input type="checkbox" id="chkIzin" disabled> Öğretmen İzni</label>
                    <div><strong>Çalışma:</strong> <select id="s4DosyaSec" class="kucuk-select"></select></div>
                    <div><strong>Sınıf:</strong> <select id="s4SinifSec" class="kucuk-select"></select></div>
                    <button id="btnDegerlendirmeBaslat" class="action blue"
                        style="font-size:12px; padding:6px 15px;">BAŞLAT</button>
                    <button id="btnDegerlendirmeSifirla" class="action red"
                        style="font-size:12px; padding:6px 15px; display:none;">Değerlendirmeyi Sıfırla</button>
                </div>
            </div>
            <div id="degerlendirmeContainer">
                <div class="deg-header">
                    <div class="deg-header-left" id="degOgrenciBaslik">--</div>
                    <div class="deg-header-center" id="degBilgiUst">--</div>
                    <div class="deg-header-right">PUAN: <span id="degPuanGosterge">0</span></div>
                </div>
                <div class="deg-card">
                    <div id="degNormalPanel" style="display:flex; width:100%; height:100%;">
                        <div class="deg-soru-bolumu"><span id="degSoruNo" style="font-weight:bold;">1</span>. Soru<div
                                id="degSoruMetin" style="font-weight:600;"></div>
                        </div>
                        <div class="deg-cevap-bolumu">
                            <div id="degCevapListesi"></div>
                        </div>
                    </div>
                </div>
                <div class="deg-controls">
                    <button class="action red" onclick="DegerlendirmeApp.nav(-1)" style="background:#9e9e9e">❮
                        Geri</button>
                    <button class="action blue" id="btnDegIleri" onclick="DegerlendirmeApp.nav(1)">İleri ❯</button>
                    <button class="action red" id="btnDegBitir" style="display:none;"
                        onclick="DegerlendirmeApp.sonrakiKisi()">💾 Kaydet / Sonraki</button>
                </div>
                <div style="text-align:right; margin-top:10px;"><button onclick="location.reload()" class="action red"
                        style="background:#9e9e9e">Kapat</button></div>
            </div>
        </div>
    </div>

    <div id="arsivModal" class="modal">
        <div class="modal-content">
            <div
                style="display:flex; justify-content:space-between; border-bottom:1px solid #ddd; padding-bottom:10px;">
                <h3 style="margin:0; color:#673AB7;">Arşiv</h3><span
                    onclick="document.getElementById('arsivModal').style.display='none'"
                    style="cursor:pointer; font-size:24px;">&times;</span>
            </div>
            <ul id="arsivDosyaListesi" style="list-style:none; padding:0; max-height:300px; overflow-y:auto;"></ul>
        </div>
    </div>

    <script>
        let globalData, secilenSinif, seciliDosyaAdi = "", aktifAtamalar = [];

        // --- GELİŞMİŞ VE GÜVENLİ LİNK DÖNÜŞTÜRÜCÜ ---
        function linkleriDonustur(text) {
            if (!text) return "";
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function (url) {
                const cleanUrl = url.trim();
                // Uzantı kontrolü için URL parametrelerini at
                const urlNoParams = cleanUrl.split('?')[0];
                const ext = urlNoParams.split('.').pop().toLowerCase();

                // 1. Google Drive & Docs (Akıllı ID Yakalama)
                if (cleanUrl.includes('drive.google.com') || cleanUrl.includes('docs.google.com')) {
                    let id = null;
                    // /d/ID/ yapısı
                    const parts = cleanUrl.split(/\/d\//);
                    if (parts.length > 1) {
                        id = parts[1].split('/')[0];
                    } else {
                        // id=ID yapısı
                        const match = cleanUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                        if (match) id = match[1];
                    }

                    if (id) {
                        // Türüne göre doğru embed linkini üret
                        let embedUrl = `https://drive.google.com/file/d/${id}/preview`; // Varsayılan
                        if (cleanUrl.includes('/document/')) embedUrl = `https://docs.google.com/document/d/${id}/preview`;
                        else if (cleanUrl.includes('/spreadsheets/')) embedUrl = `https://docs.google.com/spreadsheets/d/${id}/preview`;
                        else if (cleanUrl.includes('/presentation/')) embedUrl = `https://docs.google.com/presentation/d/${id}/preview`;

                        return `<div class="embedded-wrapper"><iframe src="${embedUrl}" class="embedded-iframe" allow="autoplay"></iframe><div class="embed-fallback"><a href="${cleanUrl}" target="_blank">📄 Dosyayı Yeni Sekmede Aç</a></div></div>`;
                    }
                }

                // 2. Resimler
                if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].includes(ext)) {
                    return `<img src="${cleanUrl}" class="embedded-img" onclick="this.classList.toggle('fullscreen')" title="Büyütmek için tıkla">`;
                }

                // 3. Ses
                if (['mp3', 'wav', 'ogg'].includes(ext)) {
                    return `<div class="embedded-wrapper"><audio controls src="${cleanUrl}" class="embedded-audio"></audio></div>`;
                }

                // 4. Video (Dosya)
                if (['mp4', 'webm', 'mov'].includes(ext)) {
                    return `<div class="embedded-wrapper"><video controls src="${cleanUrl}" class="embedded-video"></video></div>`;
                }

                // 5. YouTube
                if (cleanUrl.includes('youtube.com') || cleanUrl.includes('youtu.be')) {
                    let embedUrl = cleanUrl;
                    if (cleanUrl.includes('watch?v=')) embedUrl = cleanUrl.replace('watch?v=', 'embed/');
                    else if (cleanUrl.includes('youtu.be/')) embedUrl = cleanUrl.replace('youtu.be/', 'youtube.com/embed/');
                    // Fazlalık parametreleri temizle
                    if (embedUrl.includes('&')) embedUrl = embedUrl.split('&')[0];
                    return `<div class="embedded-wrapper"><iframe src="${embedUrl}" class="embedded-iframe" allowfullscreen></iframe></div>`;
                }

                // 6. HER ŞEY İÇİN FALLBACK (GENEL WEB SİTESİ)
                // iframe içinde açmayı dener, olmazsa link verir.
                return `<div class="embedded-wrapper">
                        <iframe src="${cleanUrl}" class="embedded-iframe" loading="lazy"></iframe>
                        <div class="embed-fallback">
                            <a href="${cleanUrl}" target="_blank">🌐 Bağlantıyı Yeni Sekmede Aç (Görüntülenemiyorsa Tıkla)</a>
                        </div>
                    </div>`;
            });
        }

        window.onload = () => {
            veritabaniniYukle().then(() => {
                s3DropdownYukle();
                s3AtamalariCek();
                s4DosyaListesiYukle();
                const sonSekme = sessionStorage.getItem('aktifSekme');
                if (sonSekme) { openTab(null, sonSekme); }
            });
        };

        function openTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(d => d.classList.remove('active'));
            document.querySelectorAll('.tab-buttons button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (evt) { evt.currentTarget.classList.add('active'); }
            else {
                const buttons = document.querySelectorAll('.tab-buttons button');
                buttons.forEach(btn => { if (btn.getAttribute('onclick').includes(tabId)) btn.classList.add('active'); });
            }
            sessionStorage.setItem('aktifSekme', tabId);
            if (tabId === 'sekme3') { s3DropdownYukle(); s3AtamalariCek(); }
            if (tabId === 'sekme2') listeyiYukle();
            if (tabId === 'sekme4') s4DosyaListesiYukle();
        }

        async function veritabaniniYukle() {
            const res = await fetch("veritabani.json");
            const data = await res.json();
            globalData = Object.values(data)[0].map(ogrenci => {
                if (ogrenci["Adınız Soyadınız"]) ogrenci["Adınız Soyadınız"] = ogrenci["Adınız Soyadınız"].toLocaleUpperCase("tr-TR");
                return ogrenci;
            });
            const siniflar = [...new Set(globalData.map(k => k["Sınıfınız"]))];
            siniflar.forEach(s => {
                document.getElementById("sinifSec").appendChild(new Option(s, s));
                document.getElementById("s3SinifSec").appendChild(new Option(s, s));
            });
        }

        function listeyiYukle() {
            fetch("/listeCalismalar").then(res => res.json()).then(dosyalar => {
                const liste = document.getElementById("calismaListesi"); liste.innerHTML = "";
                dosyalar.filter(d => d.startsWith("qwx")).forEach(d => {
                    const li = document.createElement("li");
                    li.innerHTML = `<span>${d.replace("qwx", "").replace(".json", "")}</span><button onclick="calismaArsivle('${d}')" class="btn-archive-small">Arşivle</button>`;
                    li.onclick = () => { document.querySelectorAll("#calismaListesi li").forEach(x => x.classList.remove("selected")); li.classList.add("selected"); seciliDosyaAdi = d; };
                    liste.appendChild(li);
                });
            });
        }
        function calismaArsivle(tamDosyaAdi) {
            if (!confirm("Arşivlenecek?")) return;
            fetch("/arsivle", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dosyaIsmi: tamDosyaAdi.replace(".json", "") }) })

                if (diff > 0) {
                    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((diff % (1000 * 60)) / 1000);
                    el.textContent = `${d}:${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

        document.getElementById("btnDegerlendirmeBaslat").onclick = () => {
            const sinifSel = document.getElementById("s4SinifSec");
            if (sinifSel.selectedIndex >= 0 && sinifSel.options[sinifSel.selectedIndex].text.includes("(Bitti)")) {

                return;
            }
            DegerlendirmeApp.baslat();
        };

        const DegerlendirmeApp = {
            kuyruk: [], kuyrukIndex: 0, activeVeri: null, sorular: [], sIdx: 0, anlikPuanlar: {}, seciliSinif: "", seciliCalisma: "",
            baslat: async function () {
                this.seciliCalisma = document.getElementById("s4DosyaSec").value;
                this.seciliSinif = document.getElementById("s4SinifSec").value.replace(" (Bitti)", "");
                if (!this.seciliCalisma || !this.seciliSinif) return alert("Seçim yapın.");
                try {
                    const rW = await fetch(`/calismaGetir?isim=www_${this.seciliCalisma}`);
                    if (!rW.ok) throw new Error("Dosya Yok");
                    const tumCevaplar = await rW.json();
                    const sinifKaydiVarMi = tumCevaplar.some(x => x.sinif === this.seciliSinif);
                    if (!sinifKaydiVarMi) throw new Error("Sınıf Kaydı Yok");
                } catch (e) { alert("Şu an bu Çalışmayı Değerlendiremezsiniz (Kayıt yok)."); return; }

                const qName = "qqq" + this.seciliSinif.replace(/\s/g, '') + this.seciliCalisma;
                const dQ = await (await fetch(`/calismaGetir?isim=${qName}`)).json();
                document.getElementById("degSecimPaneli").style.display = "none"; document.getElementById("degerlendirmeContainer").style.display = "block";
                document.getElementById("degBilgiUst").textContent = this.seciliCalisma;
                this.sorular = (await (await fetch(`/calismaGetir?isim=qwx${this.seciliCalisma}`)).json()).sorular || [];
                const cevaplarVerisi = await (await fetch(`/calismaGetir?isim=www_${this.seciliCalisma}`)).json();
                this.kuyruk = [];

                if (dQ.yontem === "Grup") {
                    const gruplar = await (await fetch(`/grupListesiGetir?sinif=${this.seciliSinif}`)).json();
                    gruplar.forEach((grp, idx) => {
                        const kayit = cevaplarVerisi.find(tv => grp.some(u => String(tv.ogrenciNo) === String(u["Okul Numaranız"])));
                        if (kayit && kayit.degerlendirme && kayit.degerlendirme.bitti) return;
                        this.kuyruk.push({ baslik: `${this.seciliSinif} - ${idx + 1}. GRUP`, kayit: kayit, katilmadi: !kayit || !kayit.cevaplar.length, members: grp.map(u => String(u["Okul Numaranız"])) });
                    });
                } else {
                    globalData.filter(u => u["Sınıfınız"] === this.seciliSinif).forEach(ogr => {
                        const no = String(ogr["Okul Numaranız"]); const kayit = cevaplarVerisi.find(x => String(x.ogrenciNo) === no);
                        if (kayit && kayit.degerlendirme && kayit.degerlendirme.bitti) return;
                        this.kuyruk.push({ baslik: `${no} - ${ogr["Adınız Soyadınız"]}`, kayit: kayit, katilmadi: !kayit || !kayit.cevaplar.length, members: [no] });
                    });
                }
                this.kuyrukIndex = 0; this.yukle();
            },
            yukle: function () {
                if (this.kuyrukIndex >= this.kuyruk.length) { alert("Bitti!"); location.reload(); return; }
                const item = this.kuyruk[this.kuyrukIndex]; document.getElementById("degOgrenciBaslik").textContent = item.baslik;
                this.anlikPuanlar = (item.kayit && item.kayit.puanlar) ? item.kayit.puanlar : {};
                if (item.katilmadi) { this.kuyrukIndex++; this.yukle(); }
                else if (item.kayit && item.kayit.degerlendirme && item.kayit.degerlendirme.bitti) {
                    document.getElementById("degNormalPanel").style.display = "flex"; this.activeVeri = item.kayit; this.sIdx = 0; this.renderSoru();
                }
                else { document.getElementById("degNormalPanel").style.display = "flex"; this.activeVeri = item.kayit; this.sIdx = 0; this.soruKontrolEtVeRender(1); }
            },
            soruKontrolEtVeRender: function (direction) {
                if (this.sIdx >= this.sorular.length) { this.sonrakiKisi(); return; }
                if (this.sIdx < 0) { this.sIdx = 0; }
                const cevapObj = (this.activeVeri.cevaplar || []).find(c => c.soruIndex === this.sIdx);
                const cevaplar = (cevapObj && cevapObj.cevaplar) ? cevapObj.cevaplar : [];
                const gercekCevapVarMi = cevaplar.some(txt => txt && txt.trim() !== "");
                if (!gercekCevapVarMi) {
                    this.sIdx += direction;
                    if (this.sIdx < 0) { this.sIdx = 0; this.renderSoru(); return; }
                    if (this.sIdx >= this.sorular.length) { this.sonrakiKisi(); return; }
                    this.soruKontrolEtVeRender(direction);
                } else { this.renderSoru(); }
            },
            renderSoru: function () {
                document.getElementById("degSoruNo").textContent = this.sIdx + 1;
                // LİNK DÖNÜŞTÜRME UYGULANDI
                document.getElementById("degSoruMetin").innerHTML = linkleriDonustur(this.sorular[this.sIdx]);

                const cevapObj = (this.activeVeri.cevaplar || []).find(c => c.soruIndex === this.sIdx);
                const cevaplar = (cevapObj && cevapObj.cevaplar) ? cevapObj.cevaplar : [];
                const puanlar = this.anlikPuanlar[this.sIdx] || [];
                let h = "";
                cevaplar.forEach((txt, i) => {
                    if (txt && txt.trim() !== "") {
                        const convertedTxt = linkleriDonustur(txt);
                        h += `<div class="deg-cevap-item" ondblclick="DegerlendirmeApp.hizliGecBos(event, '${txt || ''}')">
                            <div class="deg-cevap-metin">${convertedTxt}</div>
                            <div class="deg-buton-grubu">
                                <button class="deg-btn-puan deg-dogru ${puanlar[i] === 1 ? 'aktif' : ''}" onclick="event.stopPropagation(); DegerlendirmeApp.puanla(${i},1)" ondblclick="event.stopPropagation(); DegerlendirmeApp.hizliGec(${i},1)">D</button>
                                <button class="deg-btn-puan deg-yanlis ${puanlar[i] === 0 ? 'aktif' : ''}" onclick="event.stopPropagation(); DegerlendirmeApp.puanla(${i},0)" ondblclick="event.stopPropagation(); DegerlendirmeApp.hizliGec(${i},0)">Y</button>
                            </div></div>`;
                    }
                });
                document.getElementById("degCevapListesi").innerHTML = h || "Boş.";
                const son = (this.sIdx === this.sorular.length - 1);
                document.getElementById("btnDegIleri").style.display = son ? "none" : "block"; document.getElementById("btnDegBitir").style.display = son ? "block" : "none";
                this.guncellePuan();
            },
            puanla: function (cIdx, p) { if (!this.anlikPuanlar[this.sIdx]) this.anlikPuanlar[this.sIdx] = []; this.anlikPuanlar[this.sIdx][cIdx] = p; this.renderSoru(); },
            hizliGec: function (cIdx, p) { this.puanla(cIdx, p); if (this.sIdx < this.sorular.length - 1) this.nav(1); },
            hizliGecBos: function (e, metin) { if (!metin || metin.trim() === "" || e.offsetX > (e.currentTarget.offsetWidth * 0.6)) { if (this.sIdx < this.sorular.length - 1) this.nav(1); } },
            guncellePuan: function () { let t = 0; Object.values(this.anlikPuanlar).forEach(arr => { if (Array.isArray(arr)) t += arr.reduce((a, b) => a + (b || 0), 0) }); document.getElementById("degPuanGosterge").textContent = t; },
            nav: function (n) { let nextIdx = this.sIdx + n; if (nextIdx < 0) return; this.sIdx = nextIdx; this.soruKontrolEtVeRender(n); },
            sonrakiKisi: async function () {
                const item = this.kuyruk[this.kuyrukIndex];
                if (!item.katilmadi) {
                    const puanPromises = [];
                    for (const ogrNo of item.members) {
                        Object.keys(this.anlikPuanlar).forEach(sIx => {
                            const cevaplar = this.anlikPuanlar[sIx];
                            if (cevaplar) {
                                cevaplar.forEach((p, cIx) => {
                                    if (p !== undefined && p !== null) {
                                        puanPromises.push(fetch("/puanKaydet", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dosyaAdi: `www_${this.seciliCalisma}`, ogrenciNo: ogrNo, sinif: this.seciliSinif, soruIndex: parseInt(sIx), cevapIndex: cIx, puan: p }) }));
                                    }
                                });
                            }
                        });
                    }
                    await Promise.all(puanPromises);
                    const bitirPromises = [];
                    for (const ogrNo of item.members) {
                        bitirPromises.push(fetch("/degerlendirmeBitir", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dosyaAdi: `www_${this.seciliCalisma}`, ogrenciNo: ogrNo, sinif: this.seciliSinif }) }));
                    }
                    await Promise.all(bitirPromises);
                }
                this.kuyrukIndex++; this.yukle();
            }
        };
    </script>
