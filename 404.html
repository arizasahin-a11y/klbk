<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erişim Engellendi</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 90%;
        }
        .icon {
            font-size: 4rem;
            color: #ef4444;
            margin-bottom: 1.5rem;
        }
        h1 { margin: 0 0 1rem; font-size: 1.5rem; }
        p { color: #64748b; line-height: 1.6; margin-bottom: 2rem; }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1>Erişim Kısıtlanmıştır</h1>
        <p>Lütfen size verilen linkleri kullanın. Doğrudan dosya erişimi güvenlik politikası gereği engellenmiştir.</p>
        <a href="/k9x7v2m4?logout=true" class="btn">Giriş Sayfasına Dön</a>
    </div>


<style>
.loader-wrapper { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.loader-wrapper.fade-out { opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0.5s ease; }
.loader-content { text-align: center; }
.loader-ripple { display: inline-block; position: relative; width: 64px; height: 64px; margin: 0 auto 1.5rem; }
.loader-ripple div { position: absolute; border: 4px solid #f97316; opacity: 1; border-radius: 50%; animation: ripple-anim 1s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
.loader-ripple div:nth-child(2) { animation-delay: -0.5s; }
@keyframes ripple-anim { 0% { top: 28px; left: 28px; width: 0; height: 0; opacity: 1; } 100% { top: -1px; left: -1px; width: 58px; height: 58px; opacity: 0; } }
.loader-content p { font-size: 1.1rem; font-weight: 600; color: #f97316; letter-spacing: 1px; text-transform: uppercase; font-family: sans-serif; margin: 0; }
</style>
<div id="appLoader" class="loader-wrapper"><div class="loader-content"><div class="loader-ripple"><div></div><div></div></div>
<script>
window.addEventListener('DOMContentLoaded', () => {
    const loader = document.getElementById('appLoader');
    if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 600);
    }
});
</script>

</body>
</html>
