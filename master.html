<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Master Yetki Merkezi</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        .master-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .master-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .master-header h2 {
            margin: 0;
            color: var(--dark);
            font-weight: 800;
        }
        
        .master-header p {
            margin: 5px 0 0 0;
            color: var(--gray-500);
            font-size: 0.95rem;
        }

        .btn-action {
            background: #e0e7ff;
            color: #4338ca;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-action:hover {
            background: #c7d2fe;
        }

        .btn-danger {
            background: #fee2e2;
            color: #b91c1c;
        }
        .btn-danger:hover { background: #fca5a5; }

        .app-list-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .app-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid var(--gray-200);
            transition: background 0.2s;
        }
        .app-row:last-child {
            border-bottom: none;
        }
        .app-row:hover {
            background: rgba(248, 250, 252, 0.8);
        }

        .app-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }
        .app-icon {
            width: 45px;
            height: 45px;
            background: var(--gray-100);
            color: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .app-text h4 { margin: 0; font-size: 1.1rem; color: var(--dark); }
        .app-text p { margin: 2px 0 0; font-size: 0.85rem; color: var(--gray-500); }

        .app-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Toggle Switch */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(24px); }

        .assigned-users-badge {
            background: #f1f5f9;
            color: #475569;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 600px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 { margin: 0; }
        .close-modal {
            background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--gray-500);
        }
        .teacher-list {
            overflow-y: auto;
            flex: 1;
            margin-bottom: 20px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
        }
        .teacher-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid var(--gray-100);
        }
        .teacher-item:last-child { border-bottom: none; }
        .role-selector select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--gray-300);
            outline: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .master-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
                padding: 15px;
            }
            .master-header > div:last-child {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .app-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .app-controls {
                width: 100%;
                justify-content: flex-end;
                flex-wrap: wrap;
            }
            .teacher-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .role-selector {
                width: 100%;
            }
            .role-selector select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<style>
.loader-wrapper { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.loader-wrapper.fade-out { opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0.5s ease; }
.loader-content { text-align: center; }
.loader-hourglass { width: 0; height: 0; margin: 0 auto 1.5rem; border: 30px solid #f43f5e; border-radius: 50%; border-color: #f43f5e transparent #f43f5e transparent; animation: hourglass-anim 1.2s infinite; }
@keyframes hourglass-anim { 0% { transform: rotate(0); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); } 50% { transform: rotate(900deg); animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1); } 100% { transform: rotate(1800deg); } }
.loader-content p { font-size: 1.1rem; font-weight: 600; color: #f43f5e; letter-spacing: 1px; text-transform: uppercase; font-family: sans-serif; margin: 0; }
</style>
<div id="appLoader" class="loader-wrapper"><div class="loader-content"><div class="loader-hourglass"></div><p>Sistem Hazırlanıyor...</p></div></div>

    <!-- PIN Prompt Overlay (Shows by default) -->
    <div id="pinOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--gray-900); z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column;">
        <div style="background:white; padding:40px; border-radius:16px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.5); max-width:400px; width:90%;">
            <h2 style="margin-bottom: 10px; color:var(--dark);"><i class="fa-solid fa-lock" style="color:var(--primary); margin-right:8px;"></i> Master Girişi</h2>
            <p style="color:var(--gray-500); margin-bottom:20px;">Lütfen Master PIN kodunu giriniz.</p>
            <input type="password" id="masterPinInput" placeholder="PIN Kodu" style="width:100%; padding:12px; border:2px solid var(--gray-200); border-radius:8px; font-size:1.2rem; text-align:center; letter-spacing:5px; margin-bottom:20px; outline:none;">
            <button onclick="verifyPin()" class="btn-action" style="width:100%; justify-content:center; background:var(--primary); color:white; font-size:1.1rem; padding:12px;">Giriş Yap</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="master-container" id="mainContent" style="display:none;">
        <div class="master-header">
            <div>
                <h2><i class="fa-solid fa-shield-halved" style="color:var(--primary); margin-right:10px;"></i> Uygulama Yetki Merkezi</h2>
                <p>Uygulamalara genel erişimi kapatın veya özel yetkiler tanımlayın.</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-action" onclick="openChangePinModal()">
                    <i class="fa-solid fa-gear"></i> Ayarlar
                </button>
                <button class="btn-action btn-danger" onclick="window.location.href='/enter.html'">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Çıkış
                </button>
            </div>
        </div>

        <div class="app-list-container" id="appListContainer">
            <div style="text-align:center; padding:3rem; color:var(--gray-400);">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Yükleniyor...
            </div>
        </div>
    </div>

    <!-- Teacher Assignment Modal -->
    <div class="modal-overlay" id="assignModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalAppTitle">Kullanıcı Yetkilendir</h3>
                <button class="close-modal" onclick="closeAssignModal()">&times;</button>
            </div>
            <div style="margin-bottom:15px; display:flex; gap:10px;">
                <input type="text" id="teacherSearch" placeholder="Öğretmen ara..." style="flex:1; padding:8px 12px; border:1px solid var(--gray-300); border-radius:8px; outline:none;" onkeyup="filterTeachers()">
                <button class="btn-action" style="background:#e2e8f0; color:var(--dark);" onclick="toggleSelectAllTeachers()">Tümünü Seç</button>
            </div>
            <div class="teacher-list" id="teacherListContainer">
                <!-- Populated by JS -->
            </div>
            
            <div style="display:flex; justify-content:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; background:#f8fafc; padding:10px; border-radius:8px; border:1px solid var(--gray-200);">
                <span style="display:flex; align-items:center; color:var(--gray-600); font-size:0.95rem; font-weight:500;"><i class="fa-solid fa-check-double" style="margin-right:5px;"></i> Seçili Olanlara:</span>
                <button class="btn-action" style="background:#ef4444; color:white; padding:6px 12px; font-size:0.9rem;" onclick="bulkAssignRole('admin')">Admin Ata</button>
                <button class="btn-action" style="background:#3b82f6; color:white; padding:6px 12px; font-size:0.9rem;" onclick="bulkAssignRole('ogretmen')">Öğretmen Ata</button>
                <button class="btn-action" style="background:#10b981; color:white; padding:6px 12px; font-size:0.9rem;" onclick="bulkAssignRole('serbest')">Serbest Ata</button>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn-action btn-danger" style="background:#f1f5f9; color:var(--dark);" onclick="closeAssignModal()">İptal</button>
                <button class="btn-action" style="background:var(--primary); color:white;" onclick="saveAssignments()">Değişiklikleri Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Change PIN Modal -->
    <div class="modal-overlay" id="changePinModal">
        <div class="modal-content" style="max-width:400px;">
            <div class="modal-header">
                <h3>PIN Değiştir</h3>
                <button class="close-modal" onclick="closeChangePinModal()">&times;</button>
            </div>
            <div style="display:flex; flex-direction:column; gap:15px; margin-bottom:20px;">
                <input type="password" id="oldPinInput" placeholder="Eski PIN" style="padding:10px; border:1px solid var(--gray-300); border-radius:8px; text-align:center; letter-spacing:3px;">
                <input type="password" id="newPinInput" placeholder="Yeni PIN" style="padding:10px; border:1px solid var(--gray-300); border-radius:8px; text-align:center; letter-spacing:3px;">
                <input type="password" id="newPinConfirmInput" placeholder="Yeni PIN (Tekrar)" style="padding:10px; border:1px solid var(--gray-300); border-radius:8px; text-align:center; letter-spacing:3px;">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn-action btn-danger" style="background:#f1f5f9; color:var(--dark);" onclick="closeChangePinModal()">İptal</button>
                <button class="btn-action" style="background:var(--primary); color:white;" onclick="changeMasterPin()">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/master_app.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
    const loader = document.getElementById('appLoader');
    if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 600);
    }
});
</script>
</body>
</html>
